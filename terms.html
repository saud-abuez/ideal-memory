<main class="content page"><h1>شروط الاستخدام</h1><p>باستخدامك لهذا الموقع، فإنك توافق على استخدام المحتوى لأغراض مشروعة وعدم إساءة استخدام الموقع أو محاولة الإضرار به.</p><p>جميع المواد المنشورة تخضع لحقوق أصحابها، ولا يجوز إعادة استخدامها بطريقة تخالف الحقوق المطبقة.</p></main>
